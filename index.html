<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты</title>
    <style>
        :root {
            --bg-color: #f6f8fa; --container-bg: #ffffff; --text-color: #24292e; --border-color: #e1e4e8;
            --link-color: #0366d6; --link-hover-bg: #f1f8ff; --header-bg: #ffffff; --shadow-color: rgba(149, 157, 165, 0.1);
            --fallback-bg: #f6f8fa; --fallback-icon-color: #586069; --btn-bg: #f6f8fa; --btn-border: #d1d5da;
        }
        body.dark-mode {
            --bg-color: #0d1117; --container-bg: #161b22; --text-color: #c9d1d9; --border-color: #21262d;
            --link-color: #58a6ff; --link-hover-bg: #1f6feb33; --header-bg: #161b22; --shadow-color: rgba(0, 0, 0, 0.2);
            --fallback-bg: #21262d; --fallback-icon-color: #8b949e; --btn-bg: #21262d; --btn-border: #30363d;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 900px; margin: 20px auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background-color: var(--header-bg); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 8px 24px var(--shadow-color); margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 24px; }
        #theme-toggle { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 50%; }
        #theme-toggle:hover { background-color: var(--border-color); }
        #theme-toggle .icon { width: 22px; height: 22px; fill: var(--text-color); }
        
        #folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .folder-card { position: relative; aspect-ratio: 1 / 1; border-radius: 8px; background-size: cover; background-position: center; background-color: var(--fallback-bg); cursor: pointer; overflow: hidden; transition: transform 0.2s ease-out, box-shadow 0.2s ease-out; animation: fadeIn 0.5s ease-out forwards; opacity: 0; display: flex; align-items: center; justify-content: center; }
        .folder-card:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,0.15); }
        .folder-card.no-thumbnail .icon { width: 40px; height: 40px; fill: var(--fallback-icon-color); opacity: 0.7; }
        .folder-card-name { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); color: white; font-weight: 600; font-size: 15px; text-align: center; padding: 20px 10px 10px; word-break: break-word; }
        
        #file-list { list-style-type: none; padding: 0; margin: 0; background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
        #file-list li { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; transition: background-color 0.2s; animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        #file-list li:not(:last-child) { border-bottom: 1px solid var(--border-color); }
        .file-info { display: flex; align-items: center; }
        .file-info a { text-decoration: none; color: var(--link-color); font-weight: 500; font-size: 16px; cursor: pointer; }
        .file-info .icon { margin-right: 15px; width: 20px; height: 20px; fill: var(--text-color); flex-shrink: 0; }
        
        /* НОВЫЕ СТИЛИ: Кнопка скачивания */
        .download-btn { font-size: 13px; text-decoration: none; color: var(--text-color); background-color: var(--btn-bg); border: 1px solid var(--btn-border); padding: 5px 12px; border-radius: 6px; transition: background-color 0.2s, border-color 0.2s; white-space: nowrap; }
        .download-btn:hover { background-color: var(--border-color); border-color: #a1a5aa; }

        #back-link { font-size: 18px; font-weight: 600; display: block; margin-bottom: 20px; color: var(--link-color); text-decoration: none; cursor: pointer; }

        /* Стили для галереи */
        #image-preview-modal { position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
        #image-preview-modal.visible { opacity: 1; visibility: visible; transition-delay: 0s; }
        #preview-image { max-width: 90vw; max-height: 80vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.3s ease; }
        #image-preview-modal.visible #preview-image { transform: scale(1); }
        #close-modal { position: absolute; top: 15px; right: 25px; font-size: 40px; font-weight: bold; }
        #close-modal, .nav-arrow, #modal-download-link { color: white; cursor: pointer; z-index: 1001; }
        .nav-arrow { position: fixed; top: 50%; transform: translateY(-50%); background-color: rgba(30, 30, 30, 0.5); border: none; padding: 15px; border-radius: 50%; }
        #prev-image { left: 20px; } #next-image { right: 20px; }
        .nav-arrow svg { width: 24px; height: 24px; fill: currentColor; }
        
        /* НОВЫЕ СТИЛИ: Кнопка скачивания в галерее */
        #modal-download-link { position: absolute; top: 25px; right: 80px; text-decoration: none; background-color: rgba(30,30,30,0.5); padding: 8px; border-radius: 50%; }
        #modal-download-link svg { width: 22px; height: 22px; display: block; }

        #image-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        .spinner { border: 4px solid var(--border-color); border-top: 4px solid var(--link-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #content-area { text-align: center; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="header-title">Проекты</h1>
            <button id="theme-toggle" title="Сменить тему"></button>
        </header>

        <div id="content-area"></div>
    </div>

    <!-- Модальное окно галереи -->
    <div id="image-preview-modal">
        <span id="close-modal">&times;</span>
        <a id="modal-download-link" href="#" download title="Скачать изображение">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </a>
        <button id="prev-image" class="nav-arrow" title="Предыдущее (←)"><svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
        <button id="next-image" class="nav-arrow" title="Следующее (→)"><svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
        <div id="image-loader"><div class="spinner"></div></div>
        <img id="preview-image" src="" alt="Предпросмотр изображения">
    </div>

    <script>
        const USERNAME = 'akoldunim';
        const REPO = `${USERNAME}.github.io`;
        const contentArea = document.getElementById('content-area');
        const modal = document.getElementById('image-preview-modal');
        const modalImage = document.getElementById('preview-image');
        const modalDownloadLink = document.getElementById('modal-download-link');
        const closeModalBtn = document.getElementById('close-modal');
        const prevBtn = document.getElementById('prev-image');
        const nextBtn = document.getElementById('next-image');
        const imageLoader = document.getElementById('image-loader');
        let galleryImages = [];
        let currentImageIndex = -1;

        // --- ЛОГИКА ТЕМНОЙ ТЕМЫ ---
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 5.05A1 1 0 003.636 6.464l.707.707a1 1 0 001.414-1.414l-.707-.707zM3 10a1 1 0 011-1h1a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>`;
        const moonIcon = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>`;
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); themeToggle.innerHTML = sunIcon; } else { themeToggle.innerHTML = moonIcon; }
        themeToggle.addEventListener('click', () => { document.body.classList.toggle('dark-mode'); if (document.body.classList.contains('dark-mode')) { themeToggle.innerHTML = sunIcon; localStorage.setItem('theme', 'dark'); } else { themeToggle.innerHTML = moonIcon; localStorage.setItem('theme', 'light'); } });

        // --- ЛОГИКА ГАЛЕРЕИ ---
        function showImagePreview(index) { currentImageIndex = index; imageLoader.style.display = 'block'; modalImage.style.display = 'none'; const img = new Image(); img.src = galleryImages[currentImageIndex]; img.onload = () => { imageLoader.style.display = 'none'; modalImage.style.display = 'block'; modalImage.src = img.src; }; modalDownloadLink.href = galleryImages[currentImageIndex]; prevBtn.classList.toggle('hidden', currentImageIndex === 0); nextBtn.classList.toggle('hidden', currentImageIndex === galleryImages.length - 1); modal.classList.add('visible'); document.body.style.overflow = 'hidden'; }
        function hideImagePreview() { modal.classList.remove('visible'); document.body.style.overflow = 'auto'; }
        function showNextImage() { if (currentImageIndex < galleryImages.length - 1) showImagePreview(currentImageIndex + 1); }
        function showPreviousImage() { if (currentImageIndex > 0) showImagePreview(currentImageIndex - 1); }
        closeModalBtn.addEventListener('click', hideImagePreview); prevBtn.addEventListener('click', showPreviousImage); nextBtn.addEventListener('click', showNextImage); modal.addEventListener('click', (e) => { if (e.target === modal) hideImagePreview(); });
        document.addEventListener('keydown', (e) => { if (!modal.classList.contains('visible')) return; if (e.key === 'ArrowRight') showNextImage(); if (e.key === 'ArrowLeft') showPreviousImage(); if (e.key === 'Escape') hideImagePreview(); });

        // --- НОВАЯ ЛОГИКА ИСТОРИИ БРАУЗЕРА ---
        function navigateTo(path) {
            history.pushState({ path: path }, '', `#${path}`);
            fetchAndDisplayFiles(path);
        }

        window.onpopstate = function(event) {
            const path = event.state ? event.state.path : '';
            fetchAndDisplayFiles(path);
        };

        // --- ОСНОВНАЯ ЛОГИКА ОТОБРАЖЕНИЯ ---
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg', '.bmp'];
        const folderIconSVG = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>`;
        const fileIconSVG = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" /></svg>`;

        async function fetchAndDisplayFiles(path) {
            contentArea.innerHTML = '<div class="spinner"></div>';
            const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`Ошибка сети: ${response.status}`);
                const data = await response.json();
                
                const items = data.filter(item => !(item.name === 'index.html' || item.name === 'README.md' || item.name.startsWith('.'))).sort((a,b) => a.name.localeCompare(b.name));
                
                const dirs = items.filter(item => item.type === 'dir');
                let files = items.filter(item => item.type === 'file');
                
                // ИЗМЕНЕНИЕ: Отфильтровываем файлы-обложки из списка
                const folderName = path.split('/').pop();
                if (folderName) {
                    files = files.filter(file => !imageExtensions.some(ext => file.name.toLowerCase() === `${folderName}${ext}`.toLowerCase()));
                }

                const foldersWithThumbnails = await Promise.all(
                    dirs.map(async dir => {
                        try {
                            const innerApiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${dir.path}`;
                            const innerResponse = await fetch(innerApiUrl);
                            if (!innerResponse.ok) return { ...dir, thumbnailUrl: null };
                            const innerData = await innerResponse.json();
                            const thumbnailFile = innerData.find(file => imageExtensions.some(ext => file.name.toLowerCase() === `${dir.name}${ext}`.toLowerCase()));
                            return { ...dir, thumbnailUrl: thumbnailFile ? thumbnailFile.download_url : null };
                        } catch { return { ...dir, thumbnailUrl: null }; }
                    })
                );

                renderContent(path, foldersWithThumbnails, files);

            } catch (error) { contentArea.innerHTML = `<p>Не удалось загрузить файлы: ${error.message}</p>`; }
        }

        function renderContent(path, folders, files) {
            contentArea.innerHTML = ''; 
            
            if (path !== '') {
                const parentPath = path.substring(0, path.lastIndexOf('/'));
                const backLink = document.createElement('a');
                backLink.id = 'back-link';
                backLink.textContent = '← Назад';
                backLink.onclick = (e) => { e.preventDefault(); navigateTo(parentPath); };
                contentArea.appendChild(backLink);
            }

            if (folders.length > 0) {
                const grid = document.createElement('div');
                grid.id = 'folder-grid';
                folders.forEach((folder, index) => {
                    const card = document.createElement('div');
                    card.className = `folder-card ${folder.thumbnailUrl ? '' : 'no-thumbnail'}`;
                    if (folder.thumbnailUrl) card.style.backgroundImage = `url(${folder.thumbnailUrl})`;
                    else card.innerHTML = folderIconSVG;
                    card.style.animationDelay = `${index * 50}ms`;
                    card.onclick = () => navigateTo(folder.path);

                    const name = document.createElement('div');
                    name.className = 'folder-card-name';
                    name.textContent = folder.name;
                    card.appendChild(name);
                    grid.appendChild(card);
                });
                contentArea.appendChild(grid);
            }

            if (files.length > 0) {
                galleryImages = files.filter(item => imageExtensions.some(ext => item.name.toLowerCase().endsWith(ext))).map(item => item.download_url);
                const list = document.createElement('ul');
                list.id = 'file-list';
                files.forEach((file, index) => {
                    const listItem = document.createElement('li');
                    listItem.style.animationDelay = `${(folders.length + index) * 50}ms`;
                    const isImage = imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext));
                    
                    let fileInfoHTML = `<div class="file-info">${fileIconSVG}`;
                    if (isImage) {
                        const imageIndex = galleryImages.indexOf(file.download_url);
                        fileInfoHTML += `<a onclick="event.preventDefault(); showImagePreview(${imageIndex})">${file.name}</a></div>`;
                    } else {
                        fileInfoHTML += `<span>${file.name}</span></div>`;
                    }
                    
                    const downloadBtnHTML = `<a href="${file.download_url}" class="download-btn" download>Скачать</a>`;
                    listItem.innerHTML = `${fileInfoHTML} ${downloadBtnHTML}`;
                    list.appendChild(listItem);
                });
                contentArea.appendChild(list);
            }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ---
        const initialPath = window.location.hash.substring(1);
        fetchAndDisplayFiles(initialPath);

    </script>
</body>
</html>```
